<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="매일 먹은 음식을 간편하게 기록하고 칼로리와 탄수화물·단백질·지방을 확인하는 개인용 식단 관리 앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="식단 기록">
  <title>식단 기록</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5a3c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <h1 class="app-title">식단 기록</h1>
        <div class="topbar-actions">
          <button id="btn-today" class="pill-btn" hidden>오늘</button>
          <button id="btn-menu" class="icon-btn" aria-label="설정 메뉴">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      <nav class="date-nav" aria-label="날짜 이동">
        <button id="btn-prev" class="icon-btn" aria-label="이전 날짜">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="date-center">
          <button id="btn-date" class="date-btn" aria-label="달력에서 날짜 선택">
            <span id="date-text"></span>
            <span id="date-badge" class="date-badge" hidden></span>
            <svg class="icon cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </button>
          <input type="date" id="date-picker" class="date-picker" tabindex="-1" aria-hidden="true">
        </div>
        <button id="btn-next" class="icon-btn" aria-label="다음 날짜">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>
    </header>

    <main class="layout">
      <div class="col-side">
        <section id="summary" class="card summary" aria-label="하루 섭취 합계"></section>
        <section id="coach" class="card coach" aria-label="AI 식단 코치 추천" hidden></section>
      </div>
      <div class="col-main">
        <div id="meals" class="meals"></div>
      </div>
      <p class="disclaimer">영양성분은 공공 영양성분 DB를 참고한 <b>대표 추정값</b>이며, 조리법과 재료에 따라 실제와 다를 수 있습니다.<br>기록은 이 브라우저에만 저장됩니다.</p>
    </main>
  </div>

  <div id="sheet-root" class="sheet-backdrop" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-content" class="sheet-content"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/storage.js?v=2"></script>
  <script src="js/nutrition.js?v=2"></script>
  <script src="js/search.js?v=2"></script>
  <script src="js/recommend.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
